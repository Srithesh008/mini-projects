<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Expense Tracker</h1>
    </header>
    <main>
      <section>
        <h2>Summary</h2>
        <div class="summary-item">
          <h3>Total Expense</h3>
          <p id="total-expenses">₹0</p>
        </div>
        <div class="summary-item">
          <h3>Number of Expense</h3>
          <p id="expenses-count">0</p>
        </div>
      </section>
      <section>
        <h2>Add Expense</h2>

        <form action="" id="expense-form">
          <label for="expense-name">Expense Name: </label>
          <input type="text" name="name" id="expense-name" />

          <label for="expense-amt">Amount: </label>
          <input type="number" name="amt" id="expense-amt" />

          <label for="expense-cat">Category</label>
          <select name="cat" id="expense-cat">
            <option value="Food">Food</option>
            <option value="Clothes">Clothes</option>
            <option value="Travel">Travel</option>
            <option value="Saving">Saving</option>
            <option value="Other">Other</option>
          </select>
          <label for="expense-date">Date: </label>
          <input type="date" name="date" id="expense-date" />

          <button type="submit">ADD</button>
        </form>
      </section>
    </main>
    <section id="expense-list">
      <h2>Expenses</h2>
    </section>
    <footer name="foot">
      <p>© 2026 Expense Tracker</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
